
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIGCS | Motion Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #5e6ad2;
            --accent: #7170ff;
            --bg: #010102;
        }
        body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
        
        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: radial-gradient(circle at center, rgba(1, 1, 2, 0) 0%, rgba(1, 1, 2, 0.8) 100%);
            text-align: center;
            pointer-events: none;
        }

        .hud-border {
            position: absolute;
            width: 90vw;
            height: 80vh;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
        }
        
        .corner { position: absolute; width: 20px; height: 20px; border: 2px solid var(--accent); }
        .tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
        .tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
        .bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
        .br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(113, 112, 255, 0.1);
            position: absolute;
            top: 0;
            animation: scan 4s linear infinite;
        }

        @keyframes scan { from { top: 0; } to { top: 100%; } }

        h1 {
            font-size: 80px;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin: 0;
            text-transform: uppercase;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow { 
            from { text-shadow: 0 0 10px rgba(113, 112, 255, 0); }
            to { text-shadow: 0 0 30px rgba(113, 112, 255, 0.5); }
        }

        .subtitle {
            font-size: 24px;
            color: #8a8f98;
            margin-top: 10px;
            font-weight: 300;
        }

        .injection-box {
            margin-top: 60px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            text-align: left;
            width: 400px;
            opacity: 0;
            transform: translateY(20px);
            animation: reveal 1s 2s ease forwards;
        }

        @keyframes reveal { to { opacity: 1; transform: none; } }

        code { font-family: 'JetBrains Mono'; color: var(--accent); font-size: 14px; display: block; margin-bottom: 15px; }
        
        .data-line { 
            height: 10px; 
            background: rgba(255,255,255,0.05); 
            margin-bottom: 10px; 
            width: 100%; 
            position: relative;
            overflow: hidden;
        }
        .data-fill { height: 100%; background: var(--brand); width: 0; animation: fill 2s 3s ease forwards; }
        @keyframes fill { to { width: 100%; } }

        .nav-hint {
            position: absolute;
            bottom: 40px;
            font-family: 'JetBrains Mono';
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-border">
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
            <div class="scanline"></div>
        </div>

        <div class="badge" style="background: var(--brand); color: #fff; padding: 4px 12px; border-radius: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; margin-bottom: 20px;">SYSTEM ACTIVE</div>
        <h1>BIGCS</h1>
        <div class="subtitle">Boundary Intelligence & Instant Injection</div>

        <div class="injection-box">
            <code>$ bigcs inject --parcel=selected</code>
            <div class="data-line"><div class="data-fill" style="width: 100%"></div></div>
            <div style="font-family: 'Times New Roman'; text-transform: uppercase; font-size: 16px;">
                Owner: Big C's Products Company<br>
                Mailing: PO Box 2431<br>
                Status: Injection Success
            </div>
        </div>

        <div class="nav-hint">Recording in 4K | 60FPS Enabled</div>
    </div>

    <script>
        let parcels = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < 15; i++) {
                parcels.push(new Parcel());
            }
        }

        function draw() {
            background(1, 1, 2);
            for (let p of parcels) {
                p.update();
                p.display();
            }
        }

        class Parcel {
            constructor() {
                this.reset();
                this.y = random(height);
            }

            reset() {
                this.x = random(width);
                this.y = -200;
                this.size = random(100, 300);
                this.speed = random(0.5, 1.5);
                this.rot = random(TWO_PI);
                this.rotSpeed = random(-0.01, 0.01);
                this.opacity = random(5, 40);
                this.sides = floor(random(4, 7));
            }

            update() {
                this.y += this.speed;
                this.rot += this.rotSpeed;
                if (this.y > height + 200) this.reset();
            }

            display() {
                push();
                translate(this.x, this.y);
                rotate(this.rot);
                noFill();
                stroke(113, 112, 255, this.opacity);
                strokeWeight(1);
                
                beginShape();
                for (let i = 0; i < this.sides; i++) {
                    let angle = TWO_PI / this.sides * i;
                    let x = cos(angle) * this.size;
                    let y = sin(angle) * this.size;
                    vertex(x, y);
                }
                endShape(CLOSE);
                
                // Drawing internal "grid" points to look techy
                fill(113, 112, 255, this.opacity);
                noStroke();
                ellipse(0, 0, 3, 3);
                pop();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
